name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integration tests
        run: |
          docker compose up \
            --build \
            --abort-on-container-exit \
            --exit-code-from tests \
            tests

      - name: Cleanup
        if: always()
        run: docker compose down -v